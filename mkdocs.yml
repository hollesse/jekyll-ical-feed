site_name: jekyll-ical-feed
site_description: Subscribable iCalendar (.ics) feeds for Jekyll sites.
site_url: https://jekyll-ical-feed.readthedocs.io/
repo_url: https://github.com/hollesse/jekyll-ical-feed
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Sources: sources.md
      - Field mapping: fields.md
      - Dates, times and time zones: dates.md
      - Subscribing and updates: subscribing.md
  - "Example: a football club": example.md
  - Configuration reference: configuration.md
  - Development: development.md
