name: Release

# Pushes the gem to RubyGems.org when a version tag (v1.2.3) is pushed.
# Uses trusted publishing: configure this repository and workflow as a
# trusted publisher for jekyll-ical-feed on rubygems.org first.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Release gem
        uses: rubygems/release-gem@v1
